<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Everything between the seo markers is generated, never hand-edited:
        • at build time by client/plugins/seoHtml.js, from the admin's Organization
          settings, so a static deploy ships the store's own copy rather than this
          placeholder;
        • at request time by the server's html-meta middleware (when it serves the
          build), which rewrites the same block per route so a shared product link
          previews as that product.
      The tags below are only what a crawler sees if neither ran. Keep the markers.
    -->
    <!--seo-->
    <title>Premium Store</title>
    <meta name="description" content="" />
    <!--/seo-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
