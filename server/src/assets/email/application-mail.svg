  <circle cx="216" cy="86" r="3" stroke="#93b4fb" stroke-width="2"/>
  <circle cx="34" cy="88" r="3" stroke="#93b4fb" stroke-width="2"/>
  <circle cx="60" cy="40" r="2.5" fill="#93b4fb"/>
  <path d="M196 20l7-7M206 34h6" stroke="#7ea6fa" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M28 46h8M24 118l6-4" stroke="#7ea6fa" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M46 26l6 5-6 5" stroke="#7ea6fa" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M198 60l5 5" stroke="#7ea6fa" stroke-width="2.4" stroke-linecap="round"/>
