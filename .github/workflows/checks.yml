
# Reusable quality gate. Called by both CI (pull requests) and CD (before deploy)
# so that what guards a PR and what guards production are literally the same job
# definitions — they cannot drift apart.
name: 🔎 Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: 🔍 Lint ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [ client, admin, server ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.pkg }}/package-lock.json

      - name: 📦 Install
        working-directory: ./${{ matrix.pkg }}
        run: npm ci

      - name: 🔍 ESLint
        working-directory: ./${{ matrix.pkg }}
        # Errors fail the job; warnings are reported but tolerated. To ratchet the
        # codebase down over time, add --max-warnings=<current count> and lower it.
        run: npm run lint

  build:
    name: 🏗️ Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ client, admin ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: 📦 Install
        working-directory: ./${{ matrix.app }}
        run: npm ci

      # Render builds from source on its own, so this is a gate, not an artifact
      # producer — nothing downstream consumes dist/, so nothing is uploaded.
      - name: 🏗️ Build
        working-directory: ./${{ matrix.app }}
        run: npm run build

  server:
    name: 🧩 Server integration smoke
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 📦 Install
        working-directory: ./server
        run: npm ci

      - name: 🔥 Boot the API against a real MongoDB and exercise it
        working-directory: ./server
        env:
          NODE_ENV: test
          PORT: 5000
          API_PREFIX: /api/v1
          MONGO_URI: mongodb://127.0.0.1:27017/ci
          # Throwaway values — present only to satisfy env.assertValid() on boot.
          JWT_ACCESS_SECRET: ci-access-secret-not-a-real-key
          JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-key
          CLIENT_URL: http://localhost:5173
          ADMIN_URL: http://localhost:5174
        run: |
          set -uo pipefail

          npm start > server.log 2>&1 &
          PID=$!
          # Always reap the server, however this step exits.
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/ > /dev/null; then
              ready=true
              break
            fi
            # If the process is already gone, waiting out the full timeout tells us nothing.
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "❌ Server exited during boot"
              cat server.log
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "❌ Server never became reachable within 60s"
            cat server.log
            exit 1
          fi
          echo "✅ Server booted and answered on /"

          # The API's own health report — same endpoint CD verifies after deploying.
          echo "→ GET /api/v1/health"
          if ! curl -sf http://127.0.0.1:5000/api/v1/health | jq -e '.success == true' > /dev/null; then
            echo "❌ /api/v1/health did not report success"
            curl -s http://127.0.0.1:5000/api/v1/health
            cat server.log
            exit 1
          fi
          echo "✅ /api/v1/health reported healthy"

          # A route that touches Mongo — proves the DB wiring and the router are live,
          # not just that Express started. An empty catalogue is a valid 200.
          echo "→ GET /api/v1/products"
          code=$(curl -s -o /tmp/products.json -w '%{http_code}' http://127.0.0.1:5000/api/v1/products)
          if [ "$code" != "200" ]; then
            echo "❌ /api/v1/products returned HTTP $code"
            cat /tmp/products.json
            cat server.log
            exit 1
          fi
          echo "✅ /api/v1/products returned 200"

          # An unknown path must be handled by notFound, not crash or hang.
          echo "→ GET /api/v1/__does_not_exist__"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/v1/__does_not_exist__)
          if [ "$code" != "404" ]; then
            echo "❌ Unknown route returned HTTP $code, expected 404"
            cat server.log
            exit 1
          fi
          echo "✅ Unknown route returned 404"

          # A protected route must reject an anonymous caller.
          echo "→ GET /api/v1/auth/me (anonymous)"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/v1/auth/me)
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            echo "❌ Protected route returned HTTP $code, expected 401/403"
            cat server.log
            exit 1
          fi
          echo "✅ Protected route rejected anonymous access ($code)"

          echo "🎉 Server smoke suite passed"

      - name: 📄 Server log
        if: failure()
        working-directory: ./server
        run: cat server.log || true

  audit:
    name: 🔐 Dependency audit (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [ client, admin, server ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🔐 Audit production dependencies
        working-directory: ./${{ matrix.pkg }}
        run: |
          set -uo pipefail

          # Always show the full picture, at every severity.
          npm audit || true

          echo "::group::Blocking check"
          # Only critical findings block. The repo currently carries known high
          # findings (see the CI/CD notes in the PR that introduced this file);
          # once those are cleared, lower this to --audit-level=high.
          if npm audit --audit-level=critical; then
            echo "✅ No critical vulnerabilities"
          else
            echo "❌ Critical vulnerabilities present — resolve before merging"
            exit 1
          fi
          echo "::endgroup::"

  # Single job for branch protection to require, so adding or renaming a matrix
  # leg never means editing the protected-checks list in repo settings.
  verdict:
    name: ✅ All checks passed
    if: always()
    needs: [ lint, build, server, audit ]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate
        run: |
          echo "lint:   ${{ needs.lint.result }}"
          echo "build:  ${{ needs.build.result }}"
          echo "server: ${{ needs.server.result }}"
          echo "audit:  ${{ needs.audit.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All checks passed"
