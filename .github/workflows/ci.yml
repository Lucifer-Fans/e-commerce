name: 🧪 CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

# A newer push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: 🔎 Checks
    uses: ./.github/workflows/checks.yml
