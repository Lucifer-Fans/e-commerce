name: 🛡️ CodeQL

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  schedule:
    # Weekly, so newly published rules reach the codebase even on quiet weeks.
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: 🛡️ Analyze JavaScript
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: 🧭 Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended adds lower-severity rules worth seeing on an app
          # that handles payments and auth.
          queries: security-extended

      - name: 🔬 Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
